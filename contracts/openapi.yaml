openapi: 3.1.0
info:
  title: GalleryGo API
  version: 2.0.0-dev.0
  description: Implemented API operations for the GalleryGo foundation. Private gallery features are under development.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v2
security: []
tags:
  - name: System
    description: Non-sensitive health and client configuration.
  - name: Authentication
    description: HTTPS cookie sessions, session-bound CSRF, and account security.
  - name: Administration
    description: Active administrators only. Account changes revoke sessions and rotate authorization scopes.
  - name: Access
    description: Versioned group membership and fail-closed library and album grants.
  - name: Library
    description: Session-protected metadata filtered by the shared SQL authorization predicate.
  - name: Sources
    description: Registry-selected read-only source configuration, safe reachability checks, native workers, and periodic scan scheduling. Complete external metadata remains under development.
  - name: Jobs
    description: Versioned administrative job history and online-only cancellation/retry controls.
  - name: Media
    description: Current-revision metadata and private read-only content with per-request authorization and single-byte-range support.
paths:
  /admin/duplicates/exact:
    get:
      operationId: listExactDuplicateGroups
      summary: List indexed exact duplicate groups
      description: Administrator-only read of current owned revisions with equal valid source SHA-256 and byte length. Library/source filters constrain the corpus before counts and grouping. IDs are immutable representative revision identifiers, never source hashes. Reads perform no filesystem I/O or deletion and do not prove current source reachability, perceptual similarity, download permission or unchanged bytes since ingestion. Pages are live keysets, not immutable offline snapshots.
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/DuplicateLibraryFilter' }
        - { $ref: '#/components/parameters/DuplicateSourceFilter' }
      responses:
        '200':
          description: Bounded groups in stable representative-revision ID order; singleton, archived, inactive and inconsistent resources are excluded before counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExactDuplicateGroupPage' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/duplicates/exact/{group_id}/media:
    parameters:
      - name: group_id
        in: path
        required: true
        description: Opaque representative revision ID returned by the filtered group page. A rewritten, hidden or nonrepresentative anchor is not an alias for another group.
        schema: { type: string, minLength: 1, maxLength: 64 }
    get:
      operationId: listExactDuplicateMedia
      summary: List current members of an indexed exact duplicate group
      description: Administrator-only metadata with the same fresh SQL visibility and selected corpus as the group page. Default 30/max 100 member keysets use media IDs and account/scope/group/filter-bound cursors. The group must still contain at least two members and retain its immutable representative revision, otherwise 404. No source hashes, relative paths, roots or download capability are returned.
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/DuplicateLibraryFilter' }
        - { $ref: '#/components/parameters/DuplicateSourceFilter' }
      responses:
        '200':
          description: Current member metadata in stable media ID order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPage' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /people:
    get:
      operationId: listPeople
      summary: List visible indexed people and creators
      description: Requires a current session. A source-bound person is visible only through a same-source album that passes the shared library/additional-album policy. Counts and representative cover IDs use that same visible corpus; equal folder labels never merge identities. People without a concrete mapped path or visible album and inactive or inconsistent source relationships are hidden. No source paths or filesystem reads. These read pages support only limit and cursor; creator associations, search and full browsing UI remain separate work. Administrator display-label commands use separate versioned endpoints.
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Bounded person metadata in stable ID order, with only authorized album counts and cover IDs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonPage' }
        default: { $ref: '#/components/responses/Problem' }
  /people/{person_id}:
    parameters: [{ $ref: '#/components/parameters/PersonID' }]
    get:
      operationId: getPerson
      summary: Read one visible indexed person or creator
      description: Returns the same privacy-safe fields and visibility-dependent aggregates as the person list. A hidden, empty, unclassified or unknown person is 404. Metadata and cover IDs never grant original download or offline capability.
      tags: [Library]
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current visible indexed person metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /people/{person_id}/albums:
    parameters: [{ $ref: '#/components/parameters/PersonID' }]
    get:
      operationId: listPersonAlbums
      summary: List authorized albums of a visible indexed person
      description: Validates person visibility in the same fresh-session transaction, then lists only same-source albums passing the shared SQL policy. Default 30/max 100 stable album-ID keysets bind account/scope/person collection. Only limit and cursor are supported. Hidden/unknown people return 404, not a revealing empty list.
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Current authorized same-source albums in stable ID order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPage' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/people/{person_id}:
    parameters: [{ $ref: '#/components/parameters/PersonID' }]
    get:
      operationId: getAdminPersonMetadata
      summary: Read a source-bound person's display preference
      description: Current administrator and shared Person visibility required. Concrete source/path identity with a visible same-source album only; inactive or inconsistent sources and empty or unclassified people are hidden. Returns only the opaque source ID and indexed label/display override/version, never a private path or content capability. Mount loss does not prevent indexed metadata access.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/PersonMetadata' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updatePersonMetadata
      summary: Set or clear a versioned Person display-name override
      description: Online administrator-only metadata command with strong identity/version If-Match and actor-bound Idempotency-Key. Explicit empty string clears the display override; missing or null values are not implicit clears. Nonempty values use the existing trimmed display-label bounds, not search normalization. Business label/version/complete person change/outbox/audit/receipt co-commit. No-op saves only its receipt. Matching key/canonical body/original precondition returns the historical result and ETag after later edits or scans; fresh administrator authorization still applies and GET refreshes current state. Source name/path/identity, album associations, access policy and source files are not changed. Scans retain the manual display override.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonMetadataPatch' }
      responses:
        '200': { $ref: '#/components/responses/PersonMetadata' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /albums/{album_id}/tags:
    parameters: [{ $ref: '#/components/parameters/AlbumID' }]
    get:
      operationId: listAlbumTags
      summary: List authorized current tags of one visible album
      description: Fresh same-transaction session and shared Album visibility required. Hidden, inactive, inconsistent or unknown albums return 404, not an empty global catalog. Only associated tags are returned in bounded stable tag-ID order with default 30/max 100 account/scope/album-bound cursors. Only limit and cursor are supported. Tag labels have independent versions and can change without an album-version update, so this private no-store page intentionally has no album-only ETag. No unused/private global labels, source reads or content grant.
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Current authorized album-associated labels, not an immutable offline snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagPage' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/albums/{album_id}/tags:
    parameters: [{ $ref: '#/components/parameters/AlbumID' }]
    get:
      operationId: getAdminAlbumTags
      summary: Read a versioned IDs-only album tag association set
      description: Current administrator and shared active library/source visibility required. Returns only album_id/tag_ids/shared album version, never derived tag names, source paths or policy. Its strong album ETag remains valid across separate tag-label changes, but other album metadata/policy/scan changes can invalidate it. Mount outage alone does not hide indexed metadata.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AlbumTagSet' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: setAlbumTags
      summary: Replace an album's explicit bounded set of tag associations
      description: Online current-admin-only mutation with shared album visibility, exact album If-Match and actor-bound Idempotency-Key. Explicit unique known tag IDs only, maximum 100, canonicalized in stable ID order. Empty array clears only links; missing or null is not a clear. Unknown/duplicate/invalid IDs fail atomically. Real changes co-commit links/shared album version/complete album upsert including tag_ids/outbox/audit/receipt; no-op saves only its receipt. Matching canonical actor/key/target/body/original precondition retries return historical IDs/version/ETag after later edits/scans; GET refreshes current state. Existing album metadata, restrictions, sources, catalog tags and original files remain unchanged. No account-scope rotation, search normalization, batch/UI or content grant is implied.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlbumTagSetRequest' }
      responses:
        '200': { $ref: '#/components/responses/AlbumTagSet' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/albums/{album_id}:
    parameters: [{ $ref: '#/components/parameters/AlbumID' }]
    get:
      operationId: getAdminAlbumMetadata
      summary: Read administrative album display and cover preferences
      description: Current administrator and shared active library/source visibility required. Returns the indexed source label and display/current-cover/desired-cover overrides, never a relative/root path. A desired historical cover ID is not proof of current ownership or a download capability; the current cover projection is visibility checked.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AlbumMetadata' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateAlbumMetadata
      summary: Set or clear versioned album display and cover overrides
      description: Online administrator-only metadata mutation with If-Match and actor-bound Idempotency-Key. Omitted fields are unchanged; an explicit empty string clears that override and null is rejected. Name values use the existing bounded trimmed display-label policy, not search normalization. A nonempty cover must currently be eligible same-album/source media; no source files are read or written. Clearing a cover preference restores sticky automatic selection, which may retain the same current cover. Business row/version/change/outbox/audit/receipt co-commit. Matching key/body/original precondition retries return the historical result/ETag even after later edits; GET refreshes current metadata. No-op saves only its receipt. Source labels, library/source/person associations, permissions, tags and reprocessing are not editable here.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlbumMetadataPatch' }
      responses:
        '200': { $ref: '#/components/responses/AlbumMetadata' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /health/live:
    get:
      operationId: live
      summary: Check HTTP process liveness
      tags: [System]
      responses:
        '200':
          description: The HTTP process is alive; this is not a dependency check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Problem' }
  /health/ready:
    get:
      operationId: ready
      summary: Check database, worker, and observed source readiness
      description: Checks the local database and, by default, a fresh committed worker heartbeat. Active sources require matching process root pins and healthy observations newer than twice their poll interval; unknown, stale, future, unavailable, or unconfigured sources degrade the response without disabling metadata service. No NAS I/O, source counts, IDs, paths or pins are exposed. Missing required workers or dependency query failures return NOT_READY. Metadata-only mode must explicitly make the external worker optional.
      tags: [System]
      responses:
        '200':
          description: Metadata service is available; status degraded means active source observations need attention, not healthy inventory or codec acceptance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /public/config:
    get:
      operationId: publicConfig
      summary: Read non-sensitive client capabilities
      tags: [System]
      responses:
        '200':
          description: Public build information without local paths or secrets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicConfig' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      operationId: login
      summary: Sign in and rotate the current browser session
      tags: [Authentication]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in with a Secure HttpOnly SameSite=Lax host-only cookie.
          headers:
            Set-Cookie: { schema: { type: string }, description: A new opaque session cookie. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and expire its cookie
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters:
        [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: The current session is revoked. }
        default: { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      operationId: me
      summary: Read the current account from a valid server-side session
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current account state, checked on this request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/csrf:
    get:
      operationId: getCsrf
      summary: Obtain the current session's CSRF token
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: A session-bound token for authenticated unsafe requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token: { type: string, minLength: 43, maxLength: 43 }
        default: { $ref: '#/components/responses/Problem' }
  /auth/password:
    post:
      operationId: changePassword
      summary: Change the password, rotate this session, and revoke other sessions
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters:
        [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRequest' }
      responses:
        '200':
          description: Password changed; the session cookie and account scope have rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List this account's active sessions in stable ID order
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 30 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: Active sessions owned by the current account, never raw tokens or hashes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPage' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/sessions/{session_id}:
    delete:
      operationId: revokeSession
      summary: Revoke one session owned by this account
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '204':
          { description: Session revoked; revoking the current session also expires its cookie. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users:
    get:
      operationId: listUsers
      summary: List accounts in stable ID order
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Account metadata without credentials or session capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      summary: Create an account without library grants
      description: Requires an administrator. An identical idempotent retry returns the original result for 24 hours; concurrent first attempts can return IDEMPOTENCY_IN_PROGRESS and should retry the same request.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Account created, or the original creation result replayed.
          headers:
            ETag: { $ref: '#/components/headers/UserETag' }
            Location:
              description: Relative URL of the created account.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}:
    parameters:
      - { $ref: '#/components/parameters/UserID' }
    get:
      operationId: getUser
      summary: Read one account and its current ETag
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateUser
      summary: Update account policy and revoke its sessions
      description: A real change rotates the account scope and revokes all sessions, including the caller's own session when editing themselves. A no-op preserves the version and sessions. Disabling or demoting the last active administrator returns LAST_ACTIVE_ADMIN.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/UserIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteUser
      summary: Delete an account and its private application metadata
      description: The last active administrator cannot be deleted. Sessions, memberships, favorites, ratings, playlists, progress, and sync-operation receipts are removed; audit history, shared gallery metadata, and source media are preserved.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/UserIfMatch' }
      responses:
        '204': { description: Account deleted. }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}/reset-password:
    post:
      operationId: resetUserPassword
      summary: Reset a password and revoke all account sessions
      description: The account remains active or disabled as before. All sessions are revoked, including the caller's session for a self-reset. Replays use the original If-Match value and do not revoke newly created sessions again.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/UserIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}/sessions:
    get:
      operationId: listUserSessions
      summary: Inspect an account's active sessions
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Active sessions; current is true only for the calling session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPage' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}/sessions/{session_id}:
    delete:
      operationId: revokeUserSession
      summary: Revoke a session belonging to the specified account
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '204': { description: Session revoked and audited. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/audit:
    get:
      operationId: listAudit
      summary: Read security audit events, newest first
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A bounded keyset page without passwords or session capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/source-roots:
    get:
      operationId: listSourceRoots
      summary: List declared source root names without filesystem paths
      tags: [Sources]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Bounded sorted names from the immutable runtime YAML registry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceRootPage' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/sources:
    get:
      operationId: listSources
      summary: List configured source metadata in stable ID order
      tags: [Sources]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Source metadata without root paths or private configuration pins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourcePage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSource
      summary: Register a declared read-only root and mapping
      description: Selects a YAML root_name, never an arbitrary path. Does not create roots or markers, perform synchronous inventory I/O, or start a worker. Enabled consumer schedulers dispatch active registrations asynchronously by policy. Root names and canonical paths cannot be registered to two sources.
      tags: [Sources]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSourceRequest' }
      responses:
        '201':
          description: Registered source or its original idempotent result.
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Location: { $ref: '#/components/headers/CreatedLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/sources/{source_id}:
    parameters:
      - { $ref: '#/components/parameters/SourceID' }
    get:
      operationId: getSource
      summary: Inspect source configuration and reachability metadata
      tags: [Sources]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Source' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSource
      summary: Change source configuration and invalidate stale work
      description: Real changes increment configuration and resource versions, rotate affected old/destination library scopes, cancel stale source jobs, and clear reachability. No-op preserves versions. Existing indexed rows and interactions are not rewritten. A library mismatch hides old albums from all accounts until a healthy inventory reassigns them. Original bytes require a current configuration-bound inventory.
      tags: [Sources]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourcePatch' }
      responses:
        '200': { $ref: '#/components/responses/Source' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSource
      summary: Remove an empty source registration without touching files
      description: Indexed albums or entries return SOURCE_NOT_EMPTY. Deactivate an indexed source instead; this endpoint never purges it. Cancels outstanding source jobs atomically and retains audit/job history.
      tags: [Sources]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '204':
          {
            description: Empty registration removed; original directories and files remain unchanged.,
          }
        default: { $ref: '#/components/responses/Problem' }
  /admin/sources/{source_id}/check:
    parameters:
      - { $ref: '#/components/parameters/SourceID' }
    post:
      operationId: checkSource
      summary: Check root and mount-marker reachability without scanning
      description: Accepts no request body. Returns 200 for a completed inspection, including state unavailable with a safe last_error_code. Missing roots or markers are never created and existing inventory is preserved. A healthy result is only reachability, not a completed generation or minimum-file guarantee. Filesystem I/O is outside writer transactions; role/session/version are rechecked before publication.
      tags: [Sources]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/Source' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/scans:
    post:
      operationId: enqueueScan
      summary: Enqueue a durable read-only inventory intent
      description: Administrator only. Select an active source, a source-backed album, or all active registered sources by omitting or nulling both IDs. A supplied source constraint must match the album. Canonical mode/selection/configuration snapshots deduplicate identical active intents; scan and reprocess never coalesce. Targets and source dependencies are private durable rows, not filesystem paths or unbounded JSON. This operation performs no filesystem I/O. A 202 response means accepted/queued, not ingested; a compatible embedded or standalone native worker executes the intent. Automatic source scheduling uses the same immutable intent boundaries and can be disabled through supported runtime configuration. No active sources returns SCAN_NO_SOURCES. Retry the same key/body for the historical accepted result.
      tags: [Jobs]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
      responses:
        '202':
          description: Durable job accepted or identical active intent coalesced; execution may not have started.
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Location:
              description: Session-protected job metadata URL.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jobs:
    get:
      operationId: listJobs
      summary: List durable jobs in stable ID order
      description: Administrator only. Counters are cumulative work units across all attempts, not unique media counts. The cursor binds the status filter as well as account scope and collection.
      tags: [Jobs]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: status
          in: query
          description: Optional single state filter. Omit it or use an empty value for all states.
          schema:
            anyOf:
              - { $ref: '#/components/schemas/JobStatus' }
              - { type: string, const: '' }
      responses:
        '200':
          description: Bounded job metadata without payloads or worker lease capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jobs/{job_id}:
    parameters:
      - { $ref: '#/components/parameters/JobID' }
    get:
      operationId: getJob
      summary: Read a job and its current version tag
      tags: [Jobs]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Job' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jobs/{job_id}/attempts:
    parameters:
      - { $ref: '#/components/parameters/JobID' }
    get:
      operationId: listJobAttempts
      summary: Read per-attempt progress and safe diagnostics
      tags: [Jobs]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Bounded attempt history in ascending attempt order; counters are local to each attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAttemptPage' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jobs/{job_id}/issues:
    parameters:
      - { $ref: '#/components/parameters/JobID' }
    get:
      operationId: listJobIssues
      summary: Read committed per-entry scan diagnostics without private worker details
      description: Administrator only. Live stable-ID keysets across all recorded attempts. Historical source/configuration/generation context survives source registration removal. No filesystem I/O or raw subprocess errors. Issue count is not a work counter; unsafe or unrepresentable relative paths are null.
      tags: [Jobs]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Safe diagnostic history; an existing job without recorded issues returns an empty page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobIssuePage' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jobs/{job_id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/JobID' }
    post:
      operationId: cancelJob
      summary: Cancel queued work or request cooperative cancellation
      description: Accepts no request body. Running work remains running with cancel_requested until its worker acknowledges or its lease expires. Publication rechecks cancellation in the business transaction. A retry of the same command returns the original result without cancelling a newer attempt.
      tags: [Jobs]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/Job' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jobs/{job_id}/retry:
    parameters:
      - { $ref: '#/components/parameters/JobID' }
    post:
      operationId: retryJob
      summary: Requeue failed, dead, or cancelled work without erasing history
      description: Accepts no request body. Extends the bounded attempt budget while preserving all counters and history. An active job with the same deduplication key returns RESOURCE_BUSY. After 100 attempts a new explicit job is required. Reusing the same request key replays the original queued result rather than starting another attempt.
      tags: [Jobs]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { $ref: '#/components/responses/Job' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/tags:
    get:
      operationId: listTags
      summary: List the administrative tag catalog in stable ID order
      description: Current administrator required, including for unused or privately associated labels. Ordinary users cannot enumerate this global catalog. Default 30/max 100 account/scope/collection-bound keysets; only limit and cursor are supported. This is live indexed metadata, not a search, association, offline or content grant.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Bounded private tag catalog page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTag
      summary: Create an exact-label catalog tag without assigning albums
      description: Uses the existing bounded trimmed display-label policy. Exact binary labels are unique; case and Unicode variants can have different IDs. This is not shared multilingual search normalization. Current admin, same-origin CSRF and explicit Idempotency-Key required. Tag/change/outbox/audit/actor receipt co-commit. Matching canonical actor/key/body retries return the original metadata and ETag even after rename/deletion; GET refreshes current state. No source access, association or permission change.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '201':
          description: Created tag or its historical idempotent result.
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Location: { $ref: '#/components/headers/CreatedLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/tags/{tag_id}:
    parameters:
      - { name: tag_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTag
      summary: Read one current administrative tag and its strong ETag
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Tag' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: renameTag
      summary: Rename a versioned catalog tag without changing associations
      description: Current admin, exact identity/version If-Match and explicit actor-bound Idempotency-Key required. Matching canonical target/body/original precondition retries return the historical result. No-op saves only its receipt; new stale commands conflict. Exact trimmed label uniqueness is preserved, not NFKC/full-fold search identity. Existing album links and policies are unchanged. Tag/version/complete change/outbox/audit/receipt co-commit.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '200': { $ref: '#/components/responses/Tag' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteTag
      summary: Delete only an unassigned catalog tag with a versioned receipt
      description: Current admin, strong If-Match, explicit Idempotency-Key and no request body required. Any album association, including an inactive/hidden album, returns TAG_IN_USE without removing the tag or edges. A successful deletion co-commits a monotonic tombstone/change/outbox/audit/receipt. Matching actor/key/original target/precondition safely replays 204 after deletion and still reauthorizes the admin. No implicit cascade, source cleanup, account-scope or content-policy change.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204':
          description: Unassigned tag removed or the historical actor-bound deletion replayed; no body.
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/groups:
    get:
      operationId: listGroups
      summary: List permission groups in stable ID order
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Bounded administrative group page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createGroup
      summary: Create a permission group without granting access
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '201':
          description: Group created, or its original idempotent result replayed.
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Location: { $ref: '#/components/headers/CreatedLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/groups/{group_id}:
    parameters:
      - { name: group_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGroup
      summary: Read a permission group and its current ETag
      tags: [Access]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Group' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: renameGroup
      summary: Rename a permission group
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '200': { $ref: '#/components/responses/Group' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteGroup
      summary: Remove a group without widening album restrictions
      description: Memberships and library/album grant edges are removed atomically. Restricted albums remain restricted even when no groups remain. Affected account scopes and containing resource versions advance; sessions remain valid but cannot use removed grants.
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '204': { description: 'Group deleted, affected scopes revoked, and operation audited.' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}/groups:
    parameters:
      - { $ref: '#/components/parameters/UserID' }
    get:
      operationId: getUserGroups
      summary: Read an account's explicit group memberships
      tags: [Access]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/UserGroups' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: setUserGroups
      summary: Replace an account's group memberships
      description: Requires the user ETag. A change rotates scope and increments the user version without signing out valid sessions. An explicit empty group_ids array removes all memberships. A no-op preserves scope and version.
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/UserIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupsRequest' }
      responses:
        '200': { $ref: '#/components/responses/UserGroups' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/libraries:
    get:
      operationId: listAdminLibraries
      summary: List all libraries, including inactive ones
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Bounded administrative library page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createLibrary
      summary: Create an empty library with no grants
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLibraryRequest' }
      responses:
        '201':
          description: Library created, or its original idempotent result replayed.
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Location: { $ref: '#/components/headers/CreatedLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/libraries/{library_id}:
    parameters:
      - { $ref: '#/components/parameters/LibraryID' }
    get:
      operationId: getAdminLibrary
      summary: Read a library's management metadata
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Library' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLibrary
      summary: Rename, activate, or deactivate a library
      description: Inactive libraries are hidden from content-facing APIs, including for administrators. Active-state changes rotate affected user and administrator scopes. Management endpoints remain available to active administrators.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLibraryRequest' }
      responses:
        '200': { $ref: '#/components/responses/Library' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteLibrary
      summary: Delete an empty library without touching source files
      description: Libraries with sources or albums return 409 LIBRARY_NOT_EMPTY; deactivate them instead. No source or media file is deleted.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '204': { description: Empty library deleted and affected scopes revoked. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/libraries/{library_id}/access:
    parameters:
      - { $ref: '#/components/parameters/LibraryID' }
    get:
      operationId: getLibraryPolicy
      summary: Read a library's explicit group grants
      tags: [Access]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/LibraryPolicy' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: setLibraryPolicy
      summary: Replace a library's grants without making an empty policy public
      description: At least one matching group is mandatory for a regular user. Empty group_ids denies all regular users. Old and new grantee scopes advance atomically with the policy, audit, and outbox.
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupsRequest' }
      responses:
        '200': { $ref: '#/components/responses/LibraryPolicy' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/albums/{album_id}/access:
    parameters:
      - { $ref: '#/components/parameters/AlbumID' }
    get:
      operationId: getAlbumPolicy
      summary: Read an album's additional restriction policy
      tags: [Access]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AlbumPolicy' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: setAlbumPolicy
      summary: Explicitly replace an album's additional restrictions
      description: A library grant is always required for a regular user. restricted=true with an empty group_ids array denies all regular users. restricted=false requires an explicit empty group_ids array and permits users who already have the library grant. Removing a group never infers this unrestricted state.
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlbumPolicyRequest' }
      responses:
        '200': { $ref: '#/components/responses/AlbumPolicy' }
        default: { $ref: '#/components/responses/Problem' }
  /libraries:
    get:
      operationId: listLibraries
      summary: List visible active libraries in stable ID order
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Only SQL-authorized active libraries; empty grants deny regular users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryPage' }
        default: { $ref: '#/components/responses/Problem' }
  /libraries/{library_id}:
    get:
      operationId: getLibrary
      summary: Read a visible active library
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/LibraryID' }
      responses:
        '200': { $ref: '#/components/responses/Library' }
        default: { $ref: '#/components/responses/Problem' }
  /albums:
    get:
      operationId: listAlbums
      summary: List visible albums with authorized media counts and covers
      description: Stable ID keyset pages. A library grant is mandatory and album restrictions only narrow it. Cross-library source relationships fail closed; these live pages are not offline snapshots.
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: SQL-authorized album metadata without private filesystem paths.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPage' }
        default: { $ref: '#/components/responses/Problem' }
  /albums/{album_id}:
    get:
      operationId: getAlbum
      summary: Read one authorized album
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/AlbumID' }
      responses:
        '200': { $ref: '#/components/responses/Album' }
        default: { $ref: '#/components/responses/Problem' }
  /albums/{album_id}/media:
    get:
      operationId: listAlbumMedia
      summary: List authorized media in an album
      description: An unauthorized or missing album returns 404 even when it contains no media. Processing media may have a null current revision. No source path or GPS metadata is returned.
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/AlbumID' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Stable ID keyset page filtered by the same media predicate as content reads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPage' }
        default: { $ref: '#/components/responses/Problem' }
  /media/{media_id}:
    get:
      operationId: getMedia
      summary: Read authorized media metadata
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/MediaID' }
      responses:
        '200':
          description: Media metadata without filesystem paths or GPS fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        default: { $ref: '#/components/responses/Problem' }
  /media/{media_id}/variants:
    get:
      operationId: listVariants
      summary: List latest ready presets for the current media revision
      description: URLs are canonical session-protected endpoints, not public or expiring bearer capabilities. Failed and retired variants and other revisions are not advertised. Offline downloads remain disabled.
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/MediaID' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Bounded ready-variant metadata without private storage keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantPage' }
        default: { $ref: '#/components/responses/Problem' }
  /media/{media_id}/variants/{variant_id}/content:
    parameters:
      - { $ref: '#/components/parameters/MediaID' }
      - { name: variant_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getVariantContent
      summary: Read an authorized ready variant from the current revision
      description: Authentication, active-account/library checks, group grants, source consistency, and ready/current-revision ownership are checked before any byte or conditional response. Only one satisfiable bytes range is supported. Strong ETags are the validators; HTTP-date If-Range values result in a full 200 response because Last-Modified is omitted. No source/cache directory is publicly mounted.
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Range' }
        - { $ref: '#/components/parameters/IfRange' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/ContentIfMatch' }
      responses:
        '200': { $ref: '#/components/responses/MediaContent' }
        '206': { $ref: '#/components/responses/PartialMediaContent' }
        '304': { $ref: '#/components/responses/NotModifiedContent' }
        '412': { $ref: '#/components/responses/Problem' }
        '416': { $ref: '#/components/responses/InvalidRange' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    head:
      operationId: headVariantContent
      summary: Inspect authorized current-variant headers without a body
      description: Runs the same authorization and file validation as GET. Range is ignored for HEAD; full representation headers or a conditional status are returned without media bytes.
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/ContentIfMatch' }
      responses:
        '200': { $ref: '#/components/responses/MediaContentHead' }
        '304': { $ref: '#/components/responses/NotModifiedContent' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /media/{media_id}/original:
    parameters:
      - { $ref: '#/components/parameters/MediaID' }
    get:
      operationId: getOriginal
      summary: Download an authorized original from a healthy configured read-only source
      description: Requires the actual account's download_original policy, including for administrators, in addition to media visibility. Policy denial is hidden as 404. Healthy active registered source, exact private root/marker configuration pin, readable mount marker, present configuration-epoch-bound entry, and matching current revision/stat signatures are required. Original bytes always use attachment disposition and a sandbox CSP; no fallback bypasses original policy. Changed or unavailable sources return 503 without altering metadata or files.
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Range' }
        - { $ref: '#/components/parameters/IfRange' }
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/ContentIfMatch' }
      responses:
        '200': { $ref: '#/components/responses/MediaContent' }
        '206': { $ref: '#/components/responses/PartialMediaContent' }
        '304': { $ref: '#/components/responses/NotModifiedContent' }
        '412': { $ref: '#/components/responses/Problem' }
        '416': { $ref: '#/components/responses/InvalidRange' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    head:
      operationId: headOriginal
      summary: Inspect original headers with the same explicit download policy
      description: Does not bypass original policy or source checks. Ignores Range and returns no response body.
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/ContentIfMatch' }
      responses:
        '200': { $ref: '#/components/responses/MediaContentHead' }
        '304': { $ref: '#/components/responses/NotModifiedContent' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: __Host-gallerygo_session }
  headers:
    MediaETag:
      description: Strong SHA-256 representation validator. It is not an authorization capability.
      schema: { type: string }
    MediaLength:
      description: Byte length of the selected full representation or returned single range.
      schema: { type: integer, format: int64, minimum: 0 }
    ContentRange:
      description: 'bytes start-end/total for 206, or bytes */total for 416.'
      schema: { type: string }
    AcceptRanges:
      description: Only single bytes ranges are supported.
      schema: { type: string, enum: [bytes] }
    ContentDisposition:
      description: Inline for safe ready variants; attachment for originals. Filename parameters are safely encoded.
      schema: { type: string }
    PrivateContentCache:
      description: Private content is never shared or globally service-worker cached.
      schema: { type: string, enum: ['private, no-store'] }
    ResourceETag:
      description: Strong tag in the quoted form "<kind>:<id>:<version>". Send it unchanged in If-Match.
      schema: { type: string }
    CreatedLocation:
      description: Relative URL of the created resource.
      schema: { type: string }
    UserETag:
      description: Strong account tag in the form "user:<id>:<version>". Send it unchanged in If-Match.
      schema: { type: string }
  parameters:
    PersonID:
      name: person_id
      in: path
      required: true
      schema: { type: string }
    DuplicateLibraryFilter:
      name: library_id
      in: query
      description: Optional current library selection applied before duplicate grouping/counts. Use at most one nonempty opaque ID.
      schema: { type: string, minLength: 1, maxLength: 64 }
    DuplicateSourceFilter:
      name: source_id
      in: query
      description: Optional current source selection applied before duplicate grouping/counts. Intersects library_id when both are present.
      schema: { type: string, minLength: 1, maxLength: 64 }
    SourceID:
      name: source_id
      in: path
      required: true
      schema: { type: string }
    JobID:
      name: job_id
      in: path
      required: true
      schema: { type: string }
    MediaID:
      name: media_id
      in: path
      required: true
      schema: { type: string }
    Range:
      name: Range
      in: header
      description: A single bytes range, open-ended range, or nonzero suffix range. Multipart, malformed, overflowing, and unsatisfiable ranges return 416 when Range applies.
      schema: { type: string }
    IfRange:
      name: If-Range
      in: header
      description: Exact strong ETag for resuming a range. A stale or weak tag or HTTP-date value causes a full 200 response. Authorization is always rechecked first.
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Standard conditional GET/HEAD validator, evaluated only after current authorization and file checks.
      schema: { type: string }
    ContentIfMatch:
      name: If-Match
      in: header
      description: Standard content precondition; mismatch returns 412 Problem JSON, unlike versioned metadata mutation conflicts.
      schema: { type: string }
    LibraryID:
      name: library_id
      in: path
      required: true
      schema: { type: string }
    AlbumID:
      name: album_id
      in: path
      required: true
      schema: { type: string }
    ResourceIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag from the target resource. Wildcards, weak tags, lists, other resource tags, and stale versions are rejected. Tags use the resource kind group, library, album, job, or source.
      schema: { type: string }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string }
    UserIfMatch:
      name: If-Match
      in: header
      required: true
      description: The exact strong ETag from the account response. Wildcards, weak tags, and lists are rejected. A stale version returns 409 VERSION_CONFLICT.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique request key, scoped to the calling administrator and retained for 24 hours. Reuse only for the identical operation, body, and original precondition. UUIDs are recommended; credentials must never be used as keys.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]{16,128}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor bound to the current account scope, collection, and canonical filter/sort parameters. Account-policy or filter changes invalidate old cursors.
      schema: { type: string, maxLength: 512 }
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured HTTPS origin; browsers supply this automatically.
      schema: { type: string, format: uri }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 43, maxLength: 43 }
  responses:
    AlbumTagSet:
      description: Current or historical actor-receipted album tag IDs and shared album version. GET refreshes current state; tag labels are not part of this body.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlbumTagSet' }
    Tag:
      description: Current or historical actor-receipted catalog tag metadata. GET refreshes current state.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Tag' }
    PersonMetadata:
      description: Current or historical actor-receipted source-bound Person label metadata. Replayed mutation results are historical; GET refreshes current state.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PersonMetadata' }
    AlbumMetadata:
      description: Current or historical actor-receipted album display/cover metadata. Replayed mutation results are historical; GET refreshes current state.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlbumMetadata' }
    Source:
      description: Source metadata and strong source version tag. Replayed commands return historical metadata; GET refreshes current state.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Source' }
    Job:
      description: Job metadata and its strong job version tag. Idempotent commands return their original result; use GET to refresh the current state.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Job' }
    MediaContent:
      description: Complete authorized bytes with validated media MIME. Originals use attachment disposition; safe ready variants use inline. No source path is disclosed.
      headers:
        ETag: { $ref: '#/components/headers/MediaETag' }
        Content-Length: { $ref: '#/components/headers/MediaLength' }
        Accept-Ranges: { $ref: '#/components/headers/AcceptRanges' }
        Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
        Cache-Control: { $ref: '#/components/headers/PrivateContentCache' }
      content:
        '*/*':
          schema: { type: string, format: binary }
    PartialMediaContent:
      description: One authorized byte range with the same MIME and privacy headers as a complete response.
      headers:
        ETag: { $ref: '#/components/headers/MediaETag' }
        Content-Length: { $ref: '#/components/headers/MediaLength' }
        Content-Range: { $ref: '#/components/headers/ContentRange' }
        Accept-Ranges: { $ref: '#/components/headers/AcceptRanges' }
        Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
        Cache-Control: { $ref: '#/components/headers/PrivateContentCache' }
      content:
        '*/*':
          schema: { type: string, format: binary }
    MediaContentHead:
      description: Authorized full-representation headers without a response body. Range is ignored for HEAD.
      headers:
        ETag: { $ref: '#/components/headers/MediaETag' }
        Content-Length: { $ref: '#/components/headers/MediaLength' }
        Accept-Ranges: { $ref: '#/components/headers/AcceptRanges' }
        Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
        Cache-Control: { $ref: '#/components/headers/PrivateContentCache' }
    NotModifiedContent:
      description: Authorized representation has the matching ETag. No response body; authorization and file state were rechecked on this request.
      headers:
        ETag: { $ref: '#/components/headers/MediaETag' }
        Cache-Control: { $ref: '#/components/headers/PrivateContentCache' }
    InvalidRange:
      description: A single satisfiable bytes range is required. Authentication and resource authorization have already passed. Privacy headers are preserved.
      headers:
        Content-Range: { $ref: '#/components/headers/ContentRange' }
        ETag: { $ref: '#/components/headers/MediaETag' }
        Cache-Control: { $ref: '#/components/headers/PrivateContentCache' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Group:
      description: Group metadata and its current strong version tag.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Group' }
    UserGroups:
      description: Account memberships, current authorization scope, and user ETag.
      headers:
        ETag: { $ref: '#/components/headers/UserETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UserGroups' }
    Library:
      description: Library metadata and current strong version tag.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Library' }
    LibraryPolicy:
      description: Explicit library grants and library ETag; an empty list denies regular users.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LibraryPolicy' }
    AlbumPolicy:
      description: Explicit album restriction state and album ETag, independent of remaining group edges.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlbumPolicy' }
    Album:
      description: Authorized album metadata, filtered media count/cover, rating aggregate, and album ETag.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Album' }
    AdminUser:
      description: Account metadata and its strong version tag, without password material.
      headers:
        ETag: { $ref: '#/components/headers/UserETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
    Problem:
      description: A request failed. Internal paths, SQL, and secrets are not disclosed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    SourceRoot:
      type: object
      additionalProperties: false
      required: [root_name]
      properties:
        root_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Exact configured label of at most 64 UTF-8 bytes; never a filesystem path.
    SourceRootPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SourceRoot' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    SourceMapping:
      type: object
      additionalProperties: false
      required: [album_depth, person_depth]
      properties:
        album_depth:
          {
            type: integer,
            minimum: 0,
            maximum: 16,
            description: Directory segments forming the album path; zero groups the source root.,
          }
        person_depth:
          {
            type: integer,
            minimum: 0,
            maximum: 16,
            description: One-based directory segment for the optional person; zero disables mapping and the value must not exceed album_depth.,
          }
    SourceMappingInput:
      type: object
      additionalProperties: false
      description: Full mapping replacement. Omitted member depths are zero; an empty object explicitly groups the whole source without person mapping. Omit mapping on source creation for album_depth 1 and person_depth 0.
      properties:
        album_depth: { type: integer, minimum: 0, maximum: 16, default: 0 }
        person_depth:
          {
            type: integer,
            minimum: 0,
            maximum: 16,
            default: 0,
            description: Must not exceed album_depth.,
          }
    CreateSourceRequest:
      type: object
      additionalProperties: false
      required: [library_id, root_name]
      properties:
        library_id: { type: string, minLength: 1, maxLength: 64 }
        root_name:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            description: Exact declared YAML source name of at most 64 UTF-8 bytes.,
          }
        mapping: { $ref: '#/components/schemas/SourceMappingInput' }
        active: { type: boolean, default: true }
        minimum_files: { type: integer, format: int64, minimum: 0, maximum: 1000000000, default: 0 }
        poll_interval_seconds:
          { type: integer, format: int64, minimum: 10, maximum: 86400, default: 60 }
        full_scan_interval_seconds:
          {
            type: integer,
            format: int64,
            minimum: 10,
            maximum: 604800,
            default: 86400,
            description: Must be at least poll_interval_seconds. Enabled worker schedulers use this periodic full-scan policy; only healthy full publication advances its evidence.,
          }
    SourcePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        library_id: { type: string, minLength: 1, maxLength: 64 }
        root_name:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            description: Exact declared YAML source name; no arbitrary path fields are accepted.,
          }
        mapping: { $ref: '#/components/schemas/SourceMappingInput' }
        active: { type: boolean }
        minimum_files: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        poll_interval_seconds: { type: integer, format: int64, minimum: 10, maximum: 86400 }
        full_scan_interval_seconds:
          {
            type: integer,
            format: int64,
            minimum: 10,
            maximum: 604800,
            description: Must be at least poll_interval_seconds.,
          }
    Source:
      type: object
      additionalProperties: false
      required:
        [
          id,
          library_id,
          root_name,
          mapping,
          active,
          minimum_files,
          poll_interval_seconds,
          full_scan_interval_seconds,
          configured,
          state,
          scan_generation,
          version,
          config_version,
          last_checked_at,
          last_healthy_at,
          last_full_scan_at,
          last_error_code,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string }
        library_id: { type: string }
        root_name: { type: string }
        mapping: { $ref: '#/components/schemas/SourceMapping' }
        active:
          {
            type: boolean,
            description: False hides this source's albums and content from all accounts.,
          }
        minimum_files: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        poll_interval_seconds: { type: integer, format: int64, minimum: 10, maximum: 86400 }
        full_scan_interval_seconds: { type: integer, format: int64, minimum: 10, maximum: 604800 }
        configured:
          {
            type: boolean,
            description: Current runtime registry matches the stored private path/marker pin; independent of reachability.,
          }
        state:
          {
            type: string,
            enum: [unknown, healthy, unavailable, error],
            description: Reachability metadata; healthy alone does not authorize inventory reconciliation.,
          }
        scan_generation:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: Last published inventory generation; zero before inventory publication.,
          }
        version: { type: integer, format: int64, minimum: 1 }
        config_version:
          {
            type: integer,
            format: int64,
            minimum: 1,
            description: Independent worker/index policy epoch; reachability checks do not increment it.,
          }
        last_checked_at: { type: [string, 'null'], format: date-time }
        last_healthy_at: { type: [string, 'null'], format: date-time }
        last_full_scan_at: { type: [string, 'null'], format: date-time }
        last_error_code:
          {
            type: [string, 'null'],
            description: Safe source diagnostic; SOURCE_UNAVAILABLE or SOURCE_NOT_CONFIGURED for reachability and SOURCE_CHANGED/IO_ERROR/MINIMUM_FILES/SCAN_LIMIT/UNSAFE_ENTRY/SYMLINK_CYCLE for inventory failure.,
          }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SourcePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Source' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    ScanRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [incremental, full]
        source_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: Active registered source ID, or an optional constraint on the selected album. Omit/null for album-derived or all-source selection.
        album_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: Source-backed album ID defining a canonical target scope; never an arbitrary path. Omit/null for source/all-source selection.
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, dead]
    Job:
      type: object
      additionalProperties: false
      description: Durable metadata only. Payloads, filesystem roots, lease owners, and deduplication tokens are never returned. The status describes the current or latest attempt, while counters retain all earlier work.
      required:
        [
          id,
          kind,
          resource_key,
          status,
          priority,
          cancel_requested,
          attempts,
          max_attempts,
          next_run_at,
          total,
          done,
          succeeded,
          failed,
          skipped,
          cancelled,
          total_known,
          error_code,
          last_error,
          version,
          created_at,
          updated_at,
          started_at,
          finished_at,
        ]
      properties:
        id: { type: string }
        kind: { type: string }
        resource_key:
          { type: string, description: Opaque resource identity; never a filesystem path. }
        status: { $ref: '#/components/schemas/JobStatus' }
        priority: { type: integer, minimum: -100, maximum: 100 }
        cancel_requested: { type: boolean }
        attempts: { type: integer, minimum: 0, maximum: 100 }
        max_attempts: { type: integer, minimum: 1, maximum: 100 }
        next_run_at: { type: string, format: date-time }
        total:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: Cumulative discovered work units including prior attempts.,
          }
        done:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: Sum of succeeded plus failed plus skipped plus cancelled; never a success count.,
          }
        succeeded: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
        skipped: { type: integer, format: int64, minimum: 0 }
        cancelled:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: Includes unfinished units closed when an attempt is interrupted.,
          }
        total_known:
          { type: boolean, description: False while this attempt is still discovering its work. }
        error_code:
          {
            type: [string, 'null'],
            description: Stable diagnostic code without private error text.,
          }
        last_error:
          {
            type: [string, 'null'],
            description: Safe fixed diagnostic message; not raw subprocess output.,
          }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    JobPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Job' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
