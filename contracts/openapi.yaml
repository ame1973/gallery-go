openapi: 3.1.0
info:
  title: GalleryGo API
  version: 2.0.0-dev.0
  description: Implemented API operations for the GalleryGo foundation. Private gallery features are under development.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v2
security: []
tags:
  - name: System
    description: Non-sensitive health and client configuration.
  - name: Authentication
    description: HTTPS cookie sessions, session-bound CSRF, and account security.
  - name: Administration
    description: Active administrators only. Account changes revoke sessions and rotate authorization scopes.
  - name: Access
    description: Versioned group membership and fail-closed library and album grants.
  - name: Library
    description: Session-protected metadata filtered by the shared SQL authorization predicate.
paths:
  /health/live:
    get:
      operationId: live
      summary: Check HTTP process liveness
      tags: [System]
      responses:
        '200':
          description: The HTTP process is alive; this is not a dependency check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Problem' }
  /health/ready:
    get:
      operationId: ready
      summary: Check metadata database readiness
      description: Checks the local database. Source and worker readiness will be added when those services are implemented.
      tags: [System]
      responses:
        '200':
          description: The metadata database is reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /public/config:
    get:
      operationId: publicConfig
      summary: Read non-sensitive client capabilities
      tags: [System]
      responses:
        '200':
          description: Public build information without local paths or secrets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicConfig' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      operationId: login
      summary: Sign in and rotate the current browser session
      tags: [Authentication]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in with a Secure HttpOnly SameSite=Lax host-only cookie.
          headers:
            Set-Cookie: { schema: { type: string }, description: A new opaque session cookie. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and expire its cookie
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters:
        [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: The current session is revoked. }
        default: { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      operationId: me
      summary: Read the current account from a valid server-side session
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current account state, checked on this request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/csrf:
    get:
      operationId: getCsrf
      summary: Obtain the current session's CSRF token
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: A session-bound token for authenticated unsafe requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token: { type: string, minLength: 43, maxLength: 43 }
        default: { $ref: '#/components/responses/Problem' }
  /auth/password:
    post:
      operationId: changePassword
      summary: Change the password, rotate this session, and revoke other sessions
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters:
        [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRequest' }
      responses:
        '200':
          description: Password changed; the session cookie and account scope have rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List this account's active sessions in stable ID order
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 30 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: Active sessions owned by the current account, never raw tokens or hashes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPage' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/sessions/{session_id}:
    delete:
      operationId: revokeSession
      summary: Revoke one session owned by this account
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '204':
          { description: Session revoked; revoking the current session also expires its cookie. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users:
    get:
      operationId: listUsers
      summary: List accounts in stable ID order
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Account metadata without credentials or session capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      summary: Create an account without library grants
      description: Requires an administrator. An identical idempotent retry returns the original result for 24 hours; concurrent first attempts can return IDEMPOTENCY_IN_PROGRESS and should retry the same request.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Account created, or the original creation result replayed.
          headers:
            ETag: { $ref: '#/components/headers/UserETag' }
            Location:
              description: Relative URL of the created account.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}:
    parameters:
      - { $ref: '#/components/parameters/UserID' }
    get:
      operationId: getUser
      summary: Read one account and its current ETag
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateUser
      summary: Update account policy and revoke its sessions
      description: A real change rotates the account scope and revokes all sessions, including the caller's own session when editing themselves. A no-op preserves the version and sessions. Disabling or demoting the last active administrator returns LAST_ACTIVE_ADMIN.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/UserIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteUser
      summary: Delete an account and its private application metadata
      description: The last active administrator cannot be deleted. Sessions, memberships, favorites, ratings, playlists, progress, and sync-operation receipts are removed; audit history, shared gallery metadata, and source media are preserved.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/UserIfMatch' }
      responses:
        '204': { description: Account deleted. }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}/reset-password:
    post:
      operationId: resetUserPassword
      summary: Reset a password and revoke all account sessions
      description: The account remains active or disabled as before. All sessions are revoked, including the caller's session for a self-reset. Replays use the original If-Match value and do not revoke newly created sessions again.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/UserIfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}/sessions:
    get:
      operationId: listUserSessions
      summary: Inspect an account's active sessions
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Active sessions; current is true only for the calling session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPage' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}/sessions/{session_id}:
    delete:
      operationId: revokeUserSession
      summary: Revoke a session belonging to the specified account
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserID' }
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '204': { description: Session revoked and audited. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/audit:
    get:
      operationId: listAudit
      summary: Read security audit events, newest first
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A bounded keyset page without passwords or session capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/groups:
    get:
      operationId: listGroups
      summary: List permission groups in stable ID order
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Bounded administrative group page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createGroup
      summary: Create a permission group without granting access
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '201':
          description: Group created, or its original idempotent result replayed.
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Location: { $ref: '#/components/headers/CreatedLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/groups/{group_id}:
    parameters:
      - { name: group_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGroup
      summary: Read a permission group and its current ETag
      tags: [Access]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Group' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: renameGroup
      summary: Rename a permission group
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '200': { $ref: '#/components/responses/Group' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteGroup
      summary: Remove a group without widening album restrictions
      description: Memberships and library/album grant edges are removed atomically. Restricted albums remain restricted even when no groups remain. Affected account scopes and containing resource versions advance; sessions remain valid but cannot use removed grants.
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '204': { description: 'Group deleted, affected scopes revoked, and operation audited.' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{user_id}/groups:
    parameters:
      - { $ref: '#/components/parameters/UserID' }
    get:
      operationId: getUserGroups
      summary: Read an account's explicit group memberships
      tags: [Access]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/UserGroups' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: setUserGroups
      summary: Replace an account's group memberships
      description: Requires the user ETag. A change rotates scope and increments the user version without signing out valid sessions. An explicit empty group_ids array removes all memberships. A no-op preserves scope and version.
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/UserIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupsRequest' }
      responses:
        '200': { $ref: '#/components/responses/UserGroups' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/libraries:
    get:
      operationId: listAdminLibraries
      summary: List all libraries, including inactive ones
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Bounded administrative library page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createLibrary
      summary: Create an empty library with no grants
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLibraryRequest' }
      responses:
        '201':
          description: Library created, or its original idempotent result replayed.
          headers:
            ETag: { $ref: '#/components/headers/ResourceETag' }
            Location: { $ref: '#/components/headers/CreatedLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/libraries/{library_id}:
    parameters:
      - { $ref: '#/components/parameters/LibraryID' }
    get:
      operationId: getAdminLibrary
      summary: Read a library's management metadata
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Library' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateLibrary
      summary: Rename, activate, or deactivate a library
      description: Inactive libraries are hidden from content-facing APIs, including for administrators. Active-state changes rotate affected user and administrator scopes. Management endpoints remain available to active administrators.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLibraryRequest' }
      responses:
        '200': { $ref: '#/components/responses/Library' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteLibrary
      summary: Delete an empty library without touching source files
      description: Libraries with sources or albums return 409 LIBRARY_NOT_EMPTY; deactivate them instead. No source or media file is deleted.
      tags: [Administration]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      responses:
        '204': { description: Empty library deleted and affected scopes revoked. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/libraries/{library_id}/access:
    parameters:
      - { $ref: '#/components/parameters/LibraryID' }
    get:
      operationId: getLibraryPolicy
      summary: Read a library's explicit group grants
      tags: [Access]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/LibraryPolicy' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: setLibraryPolicy
      summary: Replace a library's grants without making an empty policy public
      description: At least one matching group is mandatory for a regular user. Empty group_ids denies all regular users. Old and new grantee scopes advance atomically with the policy, audit, and outbox.
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupsRequest' }
      responses:
        '200': { $ref: '#/components/responses/LibraryPolicy' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/albums/{album_id}/access:
    parameters:
      - { $ref: '#/components/parameters/AlbumID' }
    get:
      operationId: getAlbumPolicy
      summary: Read an album's additional restriction policy
      tags: [Access]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AlbumPolicy' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: setAlbumPolicy
      summary: Explicitly replace an album's additional restrictions
      description: A library grant is always required for a regular user. restricted=true with an empty group_ids array denies all regular users. restricted=false requires an explicit empty group_ids array and permits users who already have the library grant. Removing a group never infers this unrestricted state.
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/ResourceIfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlbumPolicyRequest' }
      responses:
        '200': { $ref: '#/components/responses/AlbumPolicy' }
        default: { $ref: '#/components/responses/Problem' }
  /libraries:
    get:
      operationId: listLibraries
      summary: List visible active libraries in stable ID order
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Only SQL-authorized active libraries; empty grants deny regular users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryPage' }
        default: { $ref: '#/components/responses/Problem' }
  /libraries/{library_id}:
    get:
      operationId: getLibrary
      summary: Read a visible active library
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/LibraryID' }
      responses:
        '200': { $ref: '#/components/responses/Library' }
        default: { $ref: '#/components/responses/Problem' }
  /albums:
    get:
      operationId: listAlbums
      summary: List visible albums with authorized media counts and covers
      description: Stable ID keyset pages. A library grant is mandatory and album restrictions only narrow it. Cross-library source relationships fail closed; these live pages are not offline snapshots.
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: SQL-authorized album metadata without private filesystem paths.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlbumPage' }
        default: { $ref: '#/components/responses/Problem' }
  /albums/{album_id}:
    get:
      operationId: getAlbum
      summary: Read one authorized album
      tags: [Library]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/AlbumID' }
      responses:
        '200': { $ref: '#/components/responses/Album' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: __Host-gallerygo_session }
  headers:
    ResourceETag:
      description: Strong tag in the quoted form "<kind>:<id>:<version>". Send it unchanged in If-Match.
      schema: { type: string }
    CreatedLocation:
      description: Relative URL of the created resource.
      schema: { type: string }
    UserETag:
      description: Strong account tag in the form "user:<id>:<version>". Send it unchanged in If-Match.
      schema: { type: string }
  parameters:
    LibraryID:
      name: library_id
      in: path
      required: true
      schema: { type: string }
    AlbumID:
      name: album_id
      in: path
      required: true
      schema: { type: string }
    ResourceIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag from the target resource. Wildcards, weak tags, lists, other resource tags, and stale versions are rejected. Group tags use kind group, library/policy tags use library, and album/policy tags use album.
      schema: { type: string }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string }
    UserIfMatch:
      name: If-Match
      in: header
      required: true
      description: The exact strong ETag from the account response. Wildcards, weak tags, and lists are rejected. A stale version returns 409 VERSION_CONFLICT.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique request key, scoped to the calling administrator and retained for 24 hours. Reuse only for the identical operation, body, and original precondition. UUIDs are recommended; credentials must never be used as keys.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]{16,128}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor bound to the current account scope and collection. Account-policy changes invalidate old cursors.
      schema: { type: string, maxLength: 512 }
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match the configured HTTPS origin; browsers supply this automatically.
      schema: { type: string, format: uri }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 43, maxLength: 43 }
  responses:
    Group:
      description: Group metadata and its current strong version tag.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Group' }
    UserGroups:
      description: Account memberships, current authorization scope, and user ETag.
      headers:
        ETag: { $ref: '#/components/headers/UserETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UserGroups' }
    Library:
      description: Library metadata and current strong version tag.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Library' }
    LibraryPolicy:
      description: Explicit library grants and library ETag; an empty list denies regular users.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LibraryPolicy' }
    AlbumPolicy:
      description: Explicit album restriction state and album ETag, independent of remaining group edges.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlbumPolicy' }
    Album:
      description: Authorized album metadata, filtered media count/cover, rating aggregate, and album ETag.
      headers:
        ETag: { $ref: '#/components/headers/ResourceETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Album' }
    AdminUser:
      description: Account metadata and its strong version tag, without password material.
      headers:
        ETag: { $ref: '#/components/headers/UserETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
    Problem:
      description: A request failed. Internal paths, SQL, and secrets are not disclosed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed name of 1..100 Unicode characters and at most 400 UTF-8 bytes, without control characters.
    Group:
      type: object
      additionalProperties: false
      required: [id, name, version, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    GroupPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    GroupsRequest:
      type: object
      additionalProperties: false
      required: [group_ids]
      properties:
        group_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Explicit replacement set. Empty removes grants or memberships; it never grants a library.
    UserGroups:
      type: object
      additionalProperties: false
      required: [user_id, group_ids, scope_id, version]
      properties:
        user_id: { type: string }
        group_ids: { type: array, maxItems: 100, items: { type: string } }
        scope_id: { type: string }
        version: { type: integer, minimum: 1 }
    Library:
      type: object
      additionalProperties: false
      required: [id, name, active, version, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    LibraryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Library' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    CreateLibraryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            description: 'Trimmed 1..100 Unicode characters and at most 400 UTF-8 bytes, without control characters.',
          }
        active: { type: boolean, default: true }
    UpdateLibraryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          {
            type: string,
            minLength: 1,
            description: 'Trimmed 1..100 Unicode characters and at most 400 UTF-8 bytes, without control characters.',
          }
        active: { type: boolean }
    LibraryPolicy:
      type: object
      additionalProperties: false
      required: [library_id, group_ids, version]
      properties:
        library_id: { type: string }
        group_ids: { type: array, maxItems: 100, items: { type: string } }
        version: { type: integer, minimum: 1 }
    AlbumPolicy:
      type: object
      additionalProperties: false
      required: [album_id, restricted, group_ids, version]
      properties:
        album_id: { type: string }
        restricted: { type: boolean }
        group_ids: { type: array, maxItems: 100, items: { type: string } }
        version: { type: integer, minimum: 1 }
    AlbumPolicyRequest:
      type: object
      additionalProperties: false
      required: [restricted, group_ids]
      properties:
        restricted: { type: boolean }
        group_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Empty with restricted=true denies all regular users; restricted=false requires an empty array and still needs a library grant.
    Album:
      type: object
      additionalProperties: false
      required: [id, title, library_id, cover_media_id, media_count, rating_avg, version]
      properties:
        id: { type: string }
        title: { type: string }
        library_id: { type: string }
        cover_media_id: { type: [string, 'null'] }
        media_count: { type: integer, minimum: 0 }
        rating_avg: { type: [number, 'null'], minimum: 1, maximum: 5 }
        version: { type: integer, minimum: 1 }
    AlbumPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Album' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          description: Case-insensitive ASCII letters, digits, dots, underscores, and hyphens; begins with a letter or digit. Surrounding whitespace is trimmed.
        password:
          type: string
          minLength: 15
          maxLength: 72
          description: At least 15 Unicode characters and at most 72 UTF-8 bytes. Never trimmed.
        role: { type: string, enum: [admin, user], default: user }
        active: { type: boolean, default: true }
        download_original:
          type: boolean
          default: false
          description: Explicit original-download policy, also enforced for administrators when content serving is enabled.
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        role: { type: string, enum: [admin, user] }
        active: { type: boolean }
        download_original: { type: boolean }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 15
          maxLength: 72
          description: At least 15 Unicode characters and at most 72 UTF-8 bytes. Never trimmed.
    UserPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actor_user_id, event_type, resource_type, resource_id, detail, created_at]
      properties:
        id: { type: string }
        actor_user_id: { type: [string, 'null'] }
        event_type: { type: string }
        resource_type: { type: [string, 'null'] }
        resource_id: { type: [string, 'null'] }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: At most 72 UTF-8 bytes. Passwords are never trimmed.
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [old_password, new_password]
      properties:
        old_password: { type: string, minLength: 1, maxLength: 72 }
        new_password:
          type: string
          minLength: 15
          maxLength: 72
          description: At least 15 Unicode characters and no more than 72 UTF-8 bytes.
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, active, scope_id, version, download_original]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        active: { type: boolean }
        scope_id: { type: string }
        version: { type: integer, minimum: 1 }
        download_original: { type: boolean }
    Session:
      type: object
      additionalProperties: false
      required: [id, created_at, last_seen_at, expires_at, user_agent, ip_address, current]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        user_agent: { type: string }
        ip_address: { type: string }
        current: { type: boolean }
    SessionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Session' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    PublicConfig:
      type: object
      additionalProperties: false
      required: [version, offline_enabled]
      properties:
        version: { type: string }
        offline_enabled: { type: boolean }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }
