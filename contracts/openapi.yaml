      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobAttempt' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    JobIssue:
      type: object
      additionalProperties: false
      description: Committed scan source or entry diagnosis. Identifiers refer to historical inputs and do not grant access to bytes or imply current configuration.
      required:
        [
          id,
          attempt,
          source_id,
          source_config_version,
          generation_id,
          relative_path,
          error_code,
          message,
          created_at,
        ]
      properties:
        id: { type: string }
        attempt: { type: integer, minimum: 1 }
        source_id:
          {
            type: string,
            description: Historical opaque source identifier; registration may no longer exist.,
          }
        source_config_version: { type: integer, format: int64, minimum: 1 }
        generation_id:
          {
            type: [string, 'null'],
            description: Historical generation identifier; null when the source failed before a generation was created.,
          }
        relative_path:
          {
            type: [string, 'null'],
            maxLength: 4096,
            description: Validated source-relative path; dot means a source-level issue. Unsafe or unrepresentable text is null rather than guessed or exposed.,
          }
        error_code:
          {
            type: string,
            pattern: '^[A-Z][A-Z0-9_]{0,63}$',
            description: Safe stable code; unknown stored values become PROCESSING_FAILED.,
          }
        message:
          {
            type: string,
            description: Fixed safe English message selected by code; never raw diagnostics.,
          }
        created_at: { type: string, format: date-time }
    JobIssuePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobIssue' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    AlbumMetadata:
      type: object
      additionalProperties: false
      required: [id, source_name, display_name, cover_media_id, cover_override_id, version]
      properties:
        id: { type: string }
        source_name:
          type: string
          description: Indexed display label only; immutable through this endpoint and never a full relative/root path.
        display_name:
          type: [string, 'null']
          description: Current display override; null uses the indexed source label.
        cover_media_id:
          type: [string, 'null']
          description: Current visibility-checked album-owned representative media ID, not proof of a READY variant or download policy.
        cover_override_id:
          type: [string, 'null']
          description: Persisted desired cover preference. It may refer to a temporarily moved/unavailable historical choice and grants no content authority.
        version: { type: integer, format: int64, minimum: 1 }
    AlbumMetadataPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          description: Empty string clears the override; omitted unchanged. Other values are trimmed and must then contain 1 to 100 Unicode characters and at most 400 UTF-8 bytes without control characters. Null is rejected.
        cover_media_id:
          type: string
          maxLength: 64
          description: Currently eligible same-album/source media ID. Empty string clears the desired override and uses sticky automatic selection; omitted unchanged. Null is rejected.
    PersonMetadata:
      type: object
      additionalProperties: false
      required: [id, source_id, source_name, display_name, version]
      properties:
        id: { type: string }
        source_id:
          type: string
          description: Opaque indexed source identity, never its private root or marker.
        source_name:
          type: string
          description: Indexed source label only; not editable here and never a full relative path.
        display_name:
          type: [string, 'null']
          description: Current display override; null uses the indexed source label.
        version: { type: integer, format: int64, minimum: 1 }
    PersonMetadataPatch:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          description: Required explicit preference. Empty string clears the override; missing or null is not an implicit clear. Other values are trimmed and must then contain 1 to 100 Unicode characters and at most 400 UTF-8 bytes without control characters. This is not search normalization.
    Person:
      type: object
      additionalProperties: false
      required: [id, name, source_id, album_count, cover_media_id, version]
      properties:
        id:
          type: string
          description: Opaque indexed person identity; equal labels may have different IDs.
        name:
          type: string
          description: Display override when nonempty, otherwise the indexed folder label; never the full source-relative path.
        source_id:
          type: string
          description: Opaque source identifier, not its root or marker.
        album_count:
          type: integer
          format: int64
          minimum: 1
          description: Only currently authorized same-source albums.
        cover_media_id:
          type: [string, 'null']
          description: Visible same-source album-owned media only. Valid album covers are preferred, with stable-ID fallback; null when no visible media exists. No download capability is implied.
        version:
          type: integer
          format: int64
          minimum: 1
          description: Indexed person metadata version; dynamic ACL-dependent counts are not an immutable offline snapshot.
    PersonPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Person' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    ExactDuplicateGroup:
      type: object
      additionalProperties: false
      required: [id, source_size, media_count]
      properties:
        id:
          type: string
          maxLength: 64
          description: Opaque minimum current owned revision identifier within the filtered equal-signature corpus; not a source hash or mutable media ID.
        source_size: { type: integer, format: int64, minimum: 1 }
        media_count:
          type: integer
          format: int64
          minimum: 2
          description: Number of current visible logical media in this selected indexed group, not a global or current filesystem count.
    ExactDuplicateGroupPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExactDuplicateGroup' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    Media:
      type: object
      additionalProperties: false
      required:
        [
          id,
          album_id,
          kind,
          codec,
          file_name,
          width,
          height,
          duration_ms,
          animated,
          frame_count,
          loop_count,
          orientation,
          capture_at,
          revision,
          offline_capable,
        ]
      properties:
        id: { type: string }
        album_id: { type: string }
        kind: { type: string, enum: [image, video] }
        codec:
          {
            type: [string, 'null'],
            minLength: 1,
            maxLength: 64,
            pattern: '^[a-z0-9_]+$',
            description: Validated native or sandboxed image/primary non-attached video codec identifier. Null for unknown or uninspected metadata; never a raw tag or diagnostic.,
          }
        file_name: { type: string, description: Display basename only; never a filesystem path. }
        width: { type: [integer, 'null'], minimum: 1 }
        height: { type: [integer, 'null'], minimum: 1 }
        duration_ms:
          {
            type: [integer, 'null'],
            minimum: 0,
            description: Declared source duration rounded upward once to milliseconds. Video uses the primary non-attached track with container fallback only for unknown track timing. Image animation uses one declared cycle; zero/missing timing or GIF user input stays null. Never inferred from frame rate or multiplied by loop_count.,
          }
        animated:
          {
            type: [boolean, 'null'],
            description: 'Known image animation state; true for multiple PNG/APNG, GIF, WebP or AVIF sequence frames. Null when unknown; TIFF document pages do not imply animation and leave this field null.',
          }
        frame_count:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: Image frame/sample count proven by bounded container inspection; null when unknown or for TIFF document pages. AVIF uses matching sample-size/timing tables and local chunk extents; HEIF stills use one independently coded primary picture. Does not imply full pixel decoding.,
          }
        loop_count:
          {
            type: [integer, 'null'],
            minimum: 0,
            description: Total animation playthroughs; zero means infinite and one means no repetition. Null when unknown. GIF repeat counts add the initial playthrough; APNG/WebP totals and AVIF whole-edit playback counts do not. Unproven or partial AVIF repetition remains null.,
          }
        orientation:
          {
            type: [integer, 'null'],
            minimum: 1,
            maximum: 8,
            description: Validated EXIF orientation or equivalent ordered HEIF/AVIF item/video display-matrix transform. Unknown or arbitrary transforms remain null; dimensions remain encoded source dimensions.,
          }
        capture_at:
          {
            type: [string, 'null'],
            format: date-time,
            description: UTC instant truncated to milliseconds from validated original EXIF date/offset/subseconds or explicitly zoned whitelisted video creation tags. More specific video capture-date evidence takes precedence; conflicting or unzoned evidence stays null. Never inferred from mtime or host timezone. No GPS/raw tags are exposed.,
          }
        revision:
          {
            type: [string, 'null'],
            description: Current owned revision ID; null while not yet available.,
          }
        offline_capable:
          {
            type: boolean,
            description: False until explicit scoped offline download manifests are enabled.,
          }
    MediaPage:
