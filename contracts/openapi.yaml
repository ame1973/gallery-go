          done,
          succeeded,
          failed,
          skipped,
          cancelled,
        ]
      properties:
        attempt: { type: integer, minimum: 1, maximum: 100 }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error_code: { type: [string, 'null'] }
        message: { type: [string, 'null'], description: Safe fixed diagnostic message. }
        total: { type: integer, format: int64, minimum: 0 }
        done: { type: integer, format: int64, minimum: 0 }
        succeeded: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
        skipped: { type: integer, format: int64, minimum: 0 }
        cancelled: { type: integer, format: int64, minimum: 0 }
    JobAttemptPage:
      type: object
