name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: python3 -I tests/integration/repository_hygiene.py
      - run: make check
      - run: CGO_ENABLED=0 go test ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/gallerygo-arm64 ./cmd/gallerygo
      - run: pnpm audit --audit-level high
      - run: pnpm licenses list --json > /tmp/gallerygo-licenses.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/gallerygo-licenses.json
          retention-days: 7
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker build -f deploy/Dockerfile -t gallerygo:ci .
      - run: python3 -I tests/integration/docker_smoke.py gallerygo:ci
